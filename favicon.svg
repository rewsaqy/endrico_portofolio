<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Dark Noir Disc Base -->
  <rect width="128" height="128" rx="28" fill="#050508"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Manga Screentone Dots Pattern -->
  <defs>
    <pattern id="dotPattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#dotPattern)"/>

  <!-- Call of the Night Bold Crescent Moon -->
  <path d="M 68 20 C 44 20 25 39 25 64 C 25 89 44 108 68 108 C 76 108 83 106 90 102 C 67 96 50 76 50 52 C 50 38 56 26 66 18 C 66.7 18.6 67.3 19.3 68 20 Z" fill="#FFFFFF"/>

  <!-- Nocturnal Manga Star (Call of the Night Motif) -->
  <polygon points="88,26 92,38 104,42 92,46 88,58 84,46 72,42 84,38" fill="#FFFFFF"/>
  <polygon points="102,68 104,74 110,76 104,78 102,84 100,78 94,76 100,74" fill="#FFFFFF"/>
</svg>
